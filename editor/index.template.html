<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mermaid</title>
    <script src="mermaid.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--orca-font-family, ui-sans-serif, system-ui, sans-serif);
        background: var(--orca-background, Canvas);
        color: var(--orca-foreground, CanvasText);
      }
      body { display: flex; flex-direction: column; }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid color-mix(in oklab, var(--orca-foreground, currentColor) 15%, transparent);
      }
      #bar .grow {
        flex: 1;
      }
      #bar span.hint {
        opacity: 0.65;
        font-size: 12px;
      }
      button.mode {
        font: inherit;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid color-mix(in oklab, var(--orca-foreground, currentColor) 25%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.mode[aria-pressed="true"] {
        background: color-mix(in oklab, var(--orca-primary, Highlight) 30%, transparent);
        border-color: var(--orca-primary, Highlight);
      }
      .layout-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; }
      #layout { max-width: 100%; font: inherit; color: inherit; background: var(--orca-background, Canvas); border: 1px solid currentColor; border-radius: 4px; padding: 3px; }
      button:focus-visible, select:focus-visible { outline: 2px solid var(--orca-primary, Highlight); outline-offset: 2px; }
      button:disabled, select:disabled { opacity: 0.5; cursor: default; }
      #layout-status { font-size: 12px; opacity: 0.7; }
      #render-status { position: absolute; inset: 10px auto auto 10px; background: var(--orca-background, Canvas); padding: 4px 8px; font-size: 12px; }
      #render-status::after { content: ''; display: block; width: 150px; height: 12px; margin-top: 4px; background: color-mix(in oklab, currentColor 12%, transparent); }
      [hidden] { display: none !important; }
      #main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #code {
        flex: 1;
        min-width: 0;
        border: none;
        resize: none;
        padding: 10px 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: transparent;
        color: inherit;
        outline: none;
        tab-size: 2;
      }
      #splitter {
        flex: 0 0 4px;
        cursor: row-resize;
        background: color-mix(in oklab, var(--orca-foreground, currentColor) 15%, transparent);
      }
      #chartwrap {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        position: relative;
      }
      #chart {
        position: absolute;
        inset: 0;
        display: block;
        padding: 10px;
        overflow: hidden;
        cursor: grab;
      }
      #chart.dragging {
        cursor: grabbing;
      }
      #chart svg {
        display: block;
        max-width: none;
        transform-origin: 0 0;
        transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom, 1));
        transition: none;
      }
      #error {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        display: none;
        background: color-mix(in oklab, #e5534b 15%, var(--orca-background, white));
        border: 1px solid #e5534b;
        color: inherit;
        white-space: pre-wrap;
      }
      #placeholder {
        opacity: 0.5;
        font-size: 13px;
      }
      @media (min-width: 768px) {
        #main { flex-direction: row; }
        #splitter { cursor: col-resize; }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button class="mode" id="m-chart" aria-pressed="true">Chart</button>
      <button class="mode" id="m-split" aria-pressed="false">Split</button>
      <button class="mode" id="m-code" aria-pressed="false">Source</button>
      <div class="grow"></div>
      <div class="layout-controls" id="layout-controls">
        <label for="layout">Layout</label>
        <select id="layout" title="Preview layout for flowcharts; Source respects the file configuration">
          <option value="source">Source</option>
          <option value="adaptive">Adaptive</option>
          <option value="dagre">Dagre</option>
          <option value="elk">ELK</option>
        </select>
        <button class="mode" id="fit" title="Fit the whole diagram in the panel">Fit</button>
        <button class="mode" id="auto-fit" aria-pressed="true" title="Fit automatically after rendering and panel resizing">Auto-fit</button>
      </div>
      <span id="layout-status" role="status"></span>
      <span class="hint" id="hint"></span>
    </div>
    <div id="main">
      <textarea id="code" aria-label="Mermaid source" spellcheck="false" wrap="off"></textarea>
      <div id="splitter" hidden></div>
      <div id="chartwrap" hidden>
        <div id="chart"><span id="placeholder">Diagram renders here</span></div>
        <div id="render-status" role="status" hidden>Rendering diagram...</div>
        <div id="error" role="alert"></div>
      </div>
    </div>
    <script>
      'use strict'
      const code = document.getElementById('code')
      const chart = document.getElementById('chart')
      const chartwrap = document.getElementById('chartwrap')
      const splitter = document.getElementById('splitter')
      const error = document.getElementById('error')
      const hint = document.getElementById('hint')
      const layout = document.getElementById('layout')
      const fitButton = document.getElementById('fit')
      const autoFitButton = document.getElementById('auto-fit')
      const layoutControls = document.getElementById('layout-controls')
      const layoutStatus = document.getElementById('layout-status')
      const renderStatus = document.getElementById('render-status')
      const modes = {
        chart: document.getElementById('m-chart'),
        split: document.getElementById('m-split'),
        code: document.getElementById('m-code')
      }

      let mode = 'chart'
      let doc = null // { version, readOnly, content: { text } }
      let pendingEdit = false
      let renderTimer = 0
      let renderSeq = 0
      let zoom = 1
      let panX = 0
      let panY = 0
      let applyTimer = 0
      let autoFit = true
      let resizeTimer = 0

      const SAVE_DEBOUNCE_MS = 400
      const RENDER_DEBOUNCE_MS = 250

      function textOf(d) {
        return d && d.content && d.content.kind === 'text' ? d.content.text : ''
      }

      function setMode(next) {
        mode = next
        for (const [name, button] of Object.entries(modes)) {
          button.setAttribute('aria-pressed', String(name === next))
        }
        const showChart = next !== 'code'
        const showCode = next !== 'chart'
        code.hidden = !showCode
        splitter.hidden = next !== 'split'
        chartwrap.hidden = !showChart
        layoutControls.hidden = !showChart
        layoutStatus.hidden = !showChart
        hint.hidden = !showChart
        code.style.flex = next === 'split' ? '0 0 46%' : '1'
        if (showChart) scheduleRender(0)
      }

      function scheduleRender(delay) {
        clearTimeout(renderTimer)
        ++renderSeq // Invalidate an older render as soon as the input changes.
        renderTimer = setTimeout(render, delay)
      }

      function previewSource(source) {
        const isFlowchart = /^\s*(?:flowchart|graph)\s+(?:TB|TD|BT|LR|RL)\b/m.test(source)
        layout.disabled = !isFlowchart
        if (!isFlowchart || layout.value === 'source') {
          layoutStatus.textContent = isFlowchart ? 'Source layout' : 'Layout defined by diagram type'
          return source
        }
        const complex = source.split('\n').length > 30 || (source.match(/^\s*subgraph\b/gm) || []).length > 1
        const engine = layout.value === 'adaptive' ? (complex ? 'elk' : 'dagre') : layout.value
        layoutStatus.textContent = (layout.value === 'adaptive' ? 'Adaptive: ' : '') + (engine === 'elk' ? 'ELK' : 'Dagre')
        // Mermaid merges the last init directive over existing front matter and
        // directives. This copy is used only for rendering, never document edits.
        const config = { layout: engine, flowchart: { defaultRenderer: 'dagre-wrapper' } }
        return source + '\n%%{init: ' + JSON.stringify(config) + '}%%\n'
      }

      async function render() {
        const source = code.value
        const seq = ++renderSeq
        if (!source.trim()) {
          chart.textContent = ''
          const ph = document.createElement('span')
          ph.id = 'placeholder'
          ph.textContent = 'Diagram renders here'
          chart.appendChild(ph)
          error.style.display = 'none'
          renderStatus.hidden = true
          chartwrap.setAttribute('aria-busy', 'false')
          layoutStatus.textContent = ''
          layout.disabled = true
          fitButton.disabled = true
          return
        }
        renderStatus.hidden = false
        chartwrap.setAttribute('aria-busy', 'true')
        try {
          const { svg } = await window.mermaid.render('mmd-' + seq, previewSource(source))
          if (seq !== renderSeq) return
          chart.textContent = ''
          const host = document.createElement('div')
          host.innerHTML = svg
          const el = host.firstElementChild
          if (el) chart.appendChild(el)
          if (el && el.viewBox && el.viewBox.baseVal.width) {
            el.setAttribute('width', el.viewBox.baseVal.width)
            el.setAttribute('height', el.viewBox.baseVal.height)
          }
          fitButton.disabled = !el
          error.style.display = 'none'
          if (autoFit) fitView()
          else applyTransform()
        } catch (err) {
          if (seq !== renderSeq) return
          error.textContent = String((err && err.message) || err) + '\nCheck the source or choose Source / Dagre layout and try again.'
          error.style.display = 'block'
        } finally {
          if (seq === renderSeq) {
            renderStatus.hidden = true
            chartwrap.setAttribute('aria-busy', 'false')
          }
        }
      }

      function applyTransform() {
        const svg = chart.querySelector('svg')
        if (!svg) return
        svg.style.setProperty('--pan-x', panX + 'px')
        svg.style.setProperty('--pan-y', panY + 'px')
        svg.style.setProperty('--zoom', zoom)
        hint.textContent = Math.round(zoom * 100) + '%'
      }

      function resetView() {
        setAutoFit(true)
        fitView()
      }

      function setAutoFit(value) {
        autoFit = value
        autoFitButton.setAttribute('aria-pressed', String(value))
      }

      function fitView() {
        const svg = chart.querySelector('svg')
        if (!svg || chartwrap.hidden) return
        const bounds = svg.viewBox.baseVal
        const width = chart.clientWidth - 20
        const height = chart.clientHeight - 20
        if (!(bounds.width > 0 && bounds.height > 0 && width > 0 && height > 0)) return
        zoom = Math.min(1, width / bounds.width, height / bounds.height)
        panX = (width - bounds.width * zoom) / 2
        panY = (height - bounds.height * zoom) / 2
        applyTransform()
      }

      layout.addEventListener('change', () => { setAutoFit(true); scheduleRender(0) })
      fitButton.addEventListener('click', resetView)
      autoFitButton.addEventListener('click', () => {
        setAutoFit(!autoFit)
        if (autoFit) fitView()
      })
      new ResizeObserver(() => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => { if (autoFit) fitView() }, 100)
      }).observe(chartwrap)

      // Pan and zoom on the chart surface only; ctrl/meta+wheel or plain wheel zooms,
      // drag pans. Modifier-free wheel still zooms because the chart has nothing to scroll.
      chart.addEventListener('wheel', (e) => {
        e.preventDefault()
        setAutoFit(false)
        const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1
        zoom = Math.min(8, Math.max(0.001, zoom * factor))
        applyTransform()
      })
      chart.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return
        e.preventDefault()
        chart.classList.add('dragging')
        let lastX = e.clientX
        let lastY = e.clientY
        const move = (ev) => {
          setAutoFit(false)
          panX += ev.clientX - lastX
          panY += ev.clientY - lastY
          lastX = ev.clientX
          lastY = ev.clientY
          applyTransform()
        }
        const up = () => {
          chart.classList.remove('dragging')
          window.removeEventListener('mousemove', move)
          window.removeEventListener('mouseup', up)
        }
        window.addEventListener('mousemove', move)
        window.addEventListener('mouseup', up)
      })
      chart.addEventListener('dblclick', resetView)

      // ---- document protocol ----

      let lastSentText = null
      let lastSentVersion = -1

      function sendEdit() {
        if (!doc || doc.readOnly) return Promise.resolve()
        const baseVersion = doc.version
        const text = code.value
        if (text === lastSentText && baseVersion === lastSentVersion) {
          return Promise.resolve() // already applied; never resend on flush
        }
        return window.orca.document
          .applyEdit({ baseVersion, content: { kind: 'text', text } })
          .then(
            () => {
              lastSentText = text
              lastSentVersion = baseVersion
            },
            (err) => {
              // Any rejection (conflict shapes vary): adopt the fresher document instead of
              // blocking the caller — a flush must never fail the save.
              return window.orca.document.get().then((fresh) => {
                doc = fresh
                lastSentText = textOf(fresh)
                lastSentVersion = fresh.version
              })
            }
          )
      }

      function queueEdit() {
        pendingEdit = true
        clearTimeout(applyTimer)
        applyTimer = setTimeout(() => {
          pendingEdit = false
          void sendEdit()
        }, SAVE_DEBOUNCE_MS)
      }

      function adoptDocument(next) {
        const hadPending = pendingEdit
        const sameText = textOf(next) === code.value
        doc = next
        if (next.version > lastSentVersion) {
          lastSentText = textOf(next)
          lastSentVersion = next.version
        }
        code.readOnly = !!next.readOnly
        if (!sameText && !hadPending) {
          code.value = textOf(next)
          resetView()
          scheduleRender(0)
        } else if (!sameText && hadPending) {
          // Our own edit came back as the new document; adopt the version, keep the cursor.
          code.value = textOf(next)
          scheduleRender(0)
        }
      }

      code.addEventListener('input', () => {
        queueEdit()
        scheduleRender(RENDER_DEBOUNCE_MS)
      })

      // Tab inserts two spaces in the source editor instead of leaving the frame.
      code.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault()
          const start = code.selectionStart
          const end = code.selectionEnd
          code.setRangeText('  ', start, end, 'end')
          code.dispatchEvent(new Event('input'))
        }
      })

      for (const [name, button] of Object.entries(modes)) {
        button.addEventListener('click', () => setMode(name))
      }

      // Splitter drag.
      splitter.addEventListener('mousedown', (e) => {
        e.preventDefault()
        const move = (ev) => {
          const rect = document.getElementById('main').getBoundingClientRect()
          const vertical = getComputedStyle(document.getElementById('main')).flexDirection === 'column'
          const fraction = vertical ? (ev.clientY - rect.top) / rect.height : (ev.clientX - rect.left) / rect.width
          const pct = Math.min(80, Math.max(20, fraction * 100))
          code.style.flex = '0 0 ' + pct + '%'
        }
        const up = () => {
          window.removeEventListener('mousemove', move)
          window.removeEventListener('mouseup', up)
        }
        window.addEventListener('mousemove', move)
        window.addEventListener('mouseup', up)
      })

      // ---- boot ----

      if (!window.mermaid) {
        error.textContent = 'Mermaid runtime failed to load in this frame.'
        error.style.display = 'block'
      } else {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base' })
      }
      // Keep host theme tokens intact; system colours provide standalone fallbacks.
      const style = document.createElement('style')
      style.textContent =
        '.mermaid{--fontFamily:var(--orca-font-family,ui-sans-serif,system-ui);' +
        '--background:var(--orca-background,transparent)}'
      document.head.appendChild(style)

      async function boot() {
        doc = await window.orca.document.get()
        code.value = textOf(doc)
        code.readOnly = !!doc.readOnly
        setMode(code.value.includes('\n') ? 'chart' : 'chart')
        scheduleRender(0)
        window.orca.document.onDidChange(adoptDocument)
        window.orca.on('editor.flush', () => {
          clearTimeout(applyTimer)
          pendingEdit = false
          return sendEdit() || Promise.resolve()
        })
      }

      boot()
    </script>
  </body>
</html>
